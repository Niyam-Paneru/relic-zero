version: 2.1

orbs:
  node: circleci/node@5

jobs:
  verify:
    executor: node/default
    steps:
      - checkout
      - run:
          name: Syntax-check source
          command: |
            for file in src/*.js; do
              node --check "$file"
            done
      - run:
          name: Run behavior tests
          command: npm test
      - run:
          name: Verify public proof structure
          command: |
            test -s README.md
            grep -q '^```mermaid$' README.md
            test -s docs/overview.md
            test -s docs/decisions.md
            test -s docs/invariants.md
            test -s docs/failure-modes.md
            test -s SECURITY.md
            test -s PROVENANCE.md

workflows:
  public-proof:
    jobs:
      - verify
