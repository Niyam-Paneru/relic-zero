<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 780" role="img" aria-labelledby="title desc">
  <title id="title">Relic Zero one-use capability lifecycle</title>
  <desc id="desc">The requested action is validated first, then the invite hash is verified and public text is normalized. Only then is the old capability consumed, a public touch appended, and exactly one next capability derived. Invalid input and replayed capabilities are rejected before mutation. Visible state is replayed from public history on demand.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#20201d"/>
    </marker>
    <marker id="reject-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#a44a3f"/>
    </marker>
    <style>
      .title{font:700 30px Georgia,serif;fill:#181816}
      .subtitle{font:15px Arial,sans-serif;fill:#62615b}
      .lane{font:700 12px Arial,sans-serif;letter-spacing:2px;fill:#5f5b52}
      .node{fill:#fff;stroke:#20201d;stroke-width:1.8}
      .decision{fill:#fff;stroke:#20201d;stroke-width:1.8}
      .mutate{fill:#fff7f3;stroke:#a44a3f;stroke-width:1.8}
      .public{fill:#f7f7f3;stroke:#4f5f43;stroke-width:1.8}
      .reject{fill:#fff4f2;stroke:#a44a3f;stroke-width:1.6}
      .label{font:700 14px Arial,sans-serif;fill:#181816}
      .small{font:12px Arial,sans-serif;fill:#6a6862}
      .mono{font:11px Menlo,Consolas,monospace;fill:#6a6862}
      .line{fill:none;stroke:#20201d;stroke-width:2;marker-end:url(#arrow)}
      .rline{fill:none;stroke:#a44a3f;stroke-width:1.8;marker-end:url(#reject-arrow)}
      .branch{font:700 11px Arial,sans-serif;fill:#6a6862}
    </style>
  </defs>

  <rect width="1320" height="780" fill="#fbfaf6"/>
  <rect x="38" y="140" width="1244" height="300" fill="#f1eee6"/>
  <rect x="38" y="440" width="1244" height="260" fill="#f7f7f3"/>
  <line x1="38" y1="440" x2="1282" y2="440" stroke="#b8b4aa" stroke-width="1.5" stroke-dasharray="6 7"/>

  <text x="60" y="58" class="title">One-use capability lifecycle</text>
  <text x="60" y="90" class="subtitle">Relic Zero · validate before mutation · consume before issue · public state from append-only history</text>
  <text x="60" y="168" class="lane">PRIVATE CAPABILITY / CLAIM PROCESSING</text>
  <text x="60" y="470" class="lane">PUBLIC EVENT HISTORY</text>
  <text x="1260" y="430" text-anchor="end" class="small">invite plaintext never enters public history</text>

  <rect x="60" y="215" width="145" height="72" rx="9" class="node"/>
  <text x="132" y="243" text-anchor="middle" class="label">Invite Tₙ</text>
  <text x="132" y="266" text-anchor="middle" class="small">private plaintext</text>

  <polygon points="290,205 355,251 290,297 225,251" class="decision"/>
  <text x="290" y="246" text-anchor="middle" class="label">action valid?</text>
  <text x="290" y="267" text-anchor="middle" class="mono">bless / corrupt</text>
  <path d="M205 251 H225" class="line"/>

  <polygon points="495,205 565,251 495,297 425,251" class="decision"/>
  <text x="495" y="244" text-anchor="middle" class="label">invite hash</text>
  <text x="495" y="264" text-anchor="middle" class="label">matches active?</text>
  <path d="M355 251 H425" class="line"/>
  <text x="382" y="238" class="branch">YES</text>

  <rect x="635" y="210" width="190" height="82" rx="9" class="node"/>
  <text x="730" y="239" text-anchor="middle" class="label">Normalize public text</text>
  <text x="730" y="262" text-anchor="middle" class="small">actor ≤ 24 · message ≤ 80</text>
  <text x="730" y="281" text-anchor="middle" class="small">reject blank / over-limit</text>
  <path d="M565 251 H635" class="line"/>
  <text x="590" y="238" class="branch">YES</text>

  <rect x="895" y="210" width="185" height="82" rx="9" class="mutate"/>
  <text x="987" y="239" text-anchor="middle" class="label">Consume Tₙ</text>
  <text x="987" y="263" text-anchor="middle" class="mono">activeInviteHash = null</text>
  <text x="987" y="282" text-anchor="middle" class="small">first mutation</text>
  <path d="M825 251 H895" class="line"/>

  <rect x="1110" y="210" width="150" height="82" rx="9" class="node"/>
  <text x="1185" y="239" text-anchor="middle" class="label">Derive Tₙ₊₁</text>
  <text x="1185" y="262" text-anchor="middle" class="mono">HMAC(secret,…)</text>
  <text x="1185" y="281" text-anchor="middle" class="small">after append below</text>

  <rect x="72" y="335" width="210" height="64" rx="8" class="reject"/>
  <text x="177" y="361" text-anchor="middle" class="label">REJECT · invalid_action</text>
  <text x="177" y="383" text-anchor="middle" class="small">no capability mutation</text>
  <path d="M290 297 V320 H177 V335" class="rline"/>
  <text x="301" y="320" class="branch">NO</text>

  <rect x="360" y="335" width="260" height="64" rx="8" class="reject"/>
  <text x="490" y="361" text-anchor="middle" class="label">REJECT · invite invalid / used</text>
  <text x="490" y="383" text-anchor="middle" class="small">wrong token or replay · no mutation</text>
  <path d="M495 297 V335" class="rline"/>
  <text x="506" y="320" class="branch">NO</text>

  <rect x="665" y="335" width="210" height="64" rx="8" class="reject"/>
  <text x="770" y="361" text-anchor="middle" class="label">REJECT · invalid text</text>
  <text x="770" y="383" text-anchor="middle" class="small">normalization/length failure</text>
  <path d="M730 292 V335" class="rline"/>

  <rect x="850" y="505" width="210" height="76" rx="9" class="public"/>
  <text x="955" y="534" text-anchor="middle" class="label">Append public touch</text>
  <text x="955" y="557" text-anchor="middle" class="mono">sequence · actor · action · message</text>
  <path d="M987 292 V470 H955 V505" class="line"/>

  <path d="M1060 543 H1145 V320 H1185 V292" class="line"/>
  <text x="1160" y="338" class="small">append first</text>

  <rect x="1095" y="505" width="165" height="76" rx="9" class="node"/>
  <text x="1177" y="534" text-anchor="middle" class="label">Store hash(Tₙ₊₁)</text>
  <text x="1177" y="557" text-anchor="middle" class="small">return Tₙ₊₁ privately</text>
  <path d="M1185 292 V505" class="line"/>

  <rect x="555" y="610" width="240" height="64" rx="9" class="public"/>
  <text x="675" y="636" text-anchor="middle" class="label">On read: evolution()</text>
  <text x="675" y="658" text-anchor="middle" class="small">replay touches → visible state</text>
  <path d="M850 543 H675 V610" class="line"/>

  <text x="60" y="744" class="small">Experimental public core · in-memory demonstration · not a formally audited security protocol</text>
</svg>