<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">Relic Zero relay architecture</title><desc id="d">One active invitation is consumed by a public touch and replaced by exactly one next invitation.</desc>
<rect width="1200" height="520" fill="#f5f5f1"/>
<text x="56" y="62" fill="#71716a" font-family="Arial,sans-serif" font-size="13" letter-spacing="3">RELIC ZERO</text>
<text x="56" y="105" fill="#171714" font-family="Georgia,serif" font-size="34">Custody is the mechanic.</text>

<rect x="90" y="175" width="220" height="110" rx="16" fill="#fff" stroke="#171714" stroke-width="2"/>
<text x="115" y="208" fill="#71716a" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">PRIVATE</text>
<text x="115" y="242" fill="#171714" font-family="Georgia,serif" font-size="24">Active invite</text>
<text x="115" y="270" fill="#4e4e48" font-family="Arial,sans-serif" font-size="14">hash stored, token held by one person</text>

<rect x="490" y="145" width="220" height="170" rx="16" fill="#fff" stroke="#171714" stroke-width="2"/>
<text x="515" y="178" fill="#71716a" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">CLAIM</text>
<text x="515" y="211" fill="#171714" font-family="Georgia,serif" font-size="24">Touch the relic once.</text>
<text x="515" y="248" fill="#4e4e48" font-family="Arial,sans-serif" font-size="14">bless / corrupt</text>
<text x="515" y="274" fill="#4e4e48" font-family="Arial,sans-serif" font-size="14">append public event</text>

<rect x="890" y="175" width="220" height="110" rx="16" fill="#e4edb0" stroke="#596e35" stroke-width="2"/>
<text x="915" y="208" fill="#596e35" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">NEXT</text>
<text x="915" y="242" fill="#171714" font-family="Georgia,serif" font-size="24">Issue one invite</text>
<text x="915" y="270" fill="#4e4e48" font-family="Arial,sans-serif" font-size="14">manual handoff continues chain</text>

<path d="M310 230 H490" stroke="#171714" stroke-width="2"/>
<path d="M710 230 H890" stroke="#171714" stroke-width="2"/>
<path d="M482 224 l10 6 -10 6z" fill="#171714"/>
<path d="M882 224 l10 6 -10 6z" fill="#171714"/>

<path d="M1000 285 C1000 390 200 390 200 285" fill="none" stroke="#71716a" stroke-width="2" stroke-dasharray="7 7"/>
<text x="600" y="405" text-anchor="middle" fill="#71716a" font-family="Arial,sans-serif" font-size="14">chain continues with exactly one active capability</text>

<rect x="90" y="400" width="330" height="55" rx="12" fill="#262722"/>
<text x="115" y="434" fill="#fff" font-family="Georgia,serif" font-size="18">The panda remains uninformed about HMAC.</text>
</svg>