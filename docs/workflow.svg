<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 720" role="img" aria-labelledby="title desc">
  <title id="title">Relic Zero capability lifecycle and public-private boundary</title>
  <desc id="desc">A private one-use invite is hashed and verified, consumed before a public event is appended, then exactly one next capability is derived. Replaying the old capability is rejected. Visible state is derived from public history.</desc>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#20201d"/>
    </marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#a44a3f"/>
    </marker>
  </defs>

  <rect width="1320" height="720" fill="#fbfaf6"/>
  <rect x="36" y="148" width="1248" height="222" fill="#f1eee6"/>
  <rect x="36" y="370" width="1248" height="270" fill="#f7f7f3"/>

  <text x="64" y="62" fill="#181816" font-family="Georgia, 'Times New Roman', serif" font-size="34">One capability in. One public event. One capability out.</text>
  <text x="64" y="98" fill="#62615b" font-family="Arial, sans-serif" font-size="16">Relic Zero · capability lifecycle, replay rejection, and event-derived state</text>

  <line x1="36" y1="370" x2="1284" y2="370" stroke="#b8b4aa" stroke-width="1.5" stroke-dasharray="6 7"/>
  <text x="64" y="176" fill="#5f5b52" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">PRIVATE CAPABILITY STATE</text>
  <text x="64" y="400" fill="#5f5b52" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">PUBLIC EVENT HISTORY</text>
  <text x="1260" y="360" text-anchor="end" fill="#7a766e" font-family="Arial, sans-serif" font-size="12">token plaintext does not cross this boundary</text>

  <circle cx="120" cy="258" r="23" fill="#181816"/>
  <text x="120" y="264" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="15" font-weight="700">1</text>
  <text x="120" y="302" text-anchor="middle" fill="#181816" font-family="Arial, sans-serif" font-size="15" font-weight="700">Hold invite Tₙ</text>
  <text x="120" y="326" text-anchor="middle" fill="#6a6862" font-family="Arial, sans-serif" font-size="13">private plaintext</text>

  <line x1="150" y1="258" x2="276" y2="258" stroke="#20201d" stroke-width="2" marker-end="url(#arrow)"/>

  <circle cx="310" cy="258" r="23" fill="#181816"/>
  <text x="310" y="264" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="15" font-weight="700">2</text>
  <text x="310" y="302" text-anchor="middle" fill="#181816" font-family="Arial, sans-serif" font-size="15" font-weight="700">Hash + verify</text>
  <text x="310" y="326" text-anchor="middle" fill="#6a6862" font-family="Arial, sans-serif" font-size="13">sha256(Tₙ) = active hash?</text>

  <line x1="340" y1="258" x2="466" y2="258" stroke="#20201d" stroke-width="2" marker-end="url(#arrow)"/>

  <circle cx="500" cy="258" r="23" fill="#181816"/>
  <text x="500" y="264" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="15" font-weight="700">3</text>
  <text x="500" y="302" text-anchor="middle" fill="#181816" font-family="Arial, sans-serif" font-size="15" font-weight="700">Validate claim</text>
  <text x="500" y="326" text-anchor="middle" fill="#6a6862" font-family="Arial, sans-serif" font-size="13">action + bounded text</text>

  <line x1="530" y1="258" x2="666" y2="258" stroke="#20201d" stroke-width="2" marker-end="url(#arrow)"/>

  <circle cx="700" cy="258" r="23" fill="#a44a3f"/>
  <text x="700" y="264" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="15" font-weight="700">4</text>
  <text x="700" y="302" text-anchor="middle" fill="#181816" font-family="Arial, sans-serif" font-size="15" font-weight="700">Consume old capability</text>
  <text x="700" y="326" text-anchor="middle" fill="#8a4038" font-family="Menlo, Consolas, monospace" font-size="12">activeInviteHash = null</text>

  <path d="M700 334 L700 448" fill="none" stroke="#20201d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="716" y="412" fill="#62615b" font-family="Arial, sans-serif" font-size="12">only after consume</text>

  <circle cx="700" cy="482" r="23" fill="#181816"/>
  <text x="700" y="488" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="15" font-weight="700">5</text>
  <text x="700" y="526" text-anchor="middle" fill="#181816" font-family="Arial, sans-serif" font-size="15" font-weight="700">Append public touch</text>
  <text x="700" y="550" text-anchor="middle" fill="#6a6862" font-family="Menlo, Consolas, monospace" font-size="12">{sequence, actor, action, message}</text>

  <line x1="730" y1="482" x2="896" y2="482" stroke="#20201d" stroke-width="2" marker-end="url(#arrow)"/>

  <circle cx="930" cy="482" r="23" fill="#181816"/>
  <text x="930" y="488" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="15" font-weight="700">6</text>
  <text x="930" y="526" text-anchor="middle" fill="#181816" font-family="Arial, sans-serif" font-size="15" font-weight="700">Replay public history</text>
  <text x="930" y="550" text-anchor="middle" fill="#6a6862" font-family="Arial, sans-serif" font-size="13">derive visible relic state</text>

  <path d="M724 459 C770 405 925 404 980 288" fill="none" stroke="#20201d" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="980" cy="258" r="23" fill="#687a45"/>
  <text x="980" y="264" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="15" font-weight="700">7</text>
  <text x="980" y="300" text-anchor="middle" fill="#181816" font-family="Arial, sans-serif" font-size="14" font-weight="700">Issue exactly one</text>
  <text x="980" y="318" text-anchor="middle" fill="#181816" font-family="Arial, sans-serif" font-size="14" font-weight="700">next invite</text>
  <text x="980" y="340" text-anchor="middle" fill="#5c6943" font-family="Menlo, Consolas, monospace" font-size="11">HMAC(secret, seq, oldHash)</text>

  <line x1="1010" y1="258" x2="1150" y2="258" stroke="#20201d" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="1184" cy="258" r="23" fill="#181816"/>
  <text x="1184" y="264" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="15" font-weight="700">8</text>
  <text x="1184" y="300" text-anchor="middle" fill="#181816" font-family="Arial, sans-serif" font-size="14" font-weight="700">Store next hash</text>
  <text x="1184" y="318" text-anchor="middle" fill="#181816" font-family="Arial, sans-serif" font-size="14" font-weight="700">hand off Tₙ₊₁</text>
  <text x="1184" y="340" text-anchor="middle" fill="#6a6862" font-family="Arial, sans-serif" font-size="12">one active capability again</text>

  <path d="M120 340 C120 606 326 604 326 346" fill="none" stroke="#a44a3f" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow-red)"/>
  <text x="212" y="604" text-anchor="middle" fill="#a44a3f" font-family="Arial, sans-serif" font-size="13" font-weight="700">REPLAY OLD Tₙ → REJECT</text>
  <text x="212" y="624" text-anchor="middle" fill="#7a766e" font-family="Arial, sans-serif" font-size="12">hash no longer matches active capability · no mutation</text>

  <line x1="1038" y1="586" x2="1236" y2="586" stroke="#b8b4aa" stroke-width="1"/>
  <text x="1038" y="612" fill="#5f5b52" font-family="Arial, sans-serif" font-size="12" font-weight="700">PROOF</text>
  <text x="1092" y="612" fill="#5f5b52" font-family="Menlo, Consolas, monospace" font-size="12">test/relay.test.js</text>
  <text x="64" y="684" fill="#807c73" font-family="Arial, sans-serif" font-size="12">Experimental public core · not a formally audited security protocol</text>
</svg>
